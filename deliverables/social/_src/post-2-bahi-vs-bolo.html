<!doctype html><html lang="hi-Latn"><head><meta charset="utf-8"><title>Post 2: Bolo, parchi dekho, tap karo</title>
<link rel="stylesheet" href="base.css">
<style>
h1{font-size:112px;margin-top:26px;line-height:1.08}
.hero{margin-top:36px;display:grid;grid-template-columns:1fr 520px;gap:40px;align-items:start}
.card{border:3px solid var(--syahi);box-shadow:12px 12px 0 var(--syahi);background:var(--safed);overflow:hidden;transform:rotate(1.5deg)}

<div class="top"><span class="brand">Dukaan Dost</span><span class="pill">Udhaar ka khata</span></div>

<div class="hero">
 <div class="steps">
  <div class="step"><span class="n">1</span><div><b>Bolo</b><span>Waise, jaise munshi ji se.</span></div></div>
  <div class="step"><span class="n">2</span><div><b>Parchi dekho</b><span>Naam, rakam, disha.</span></div></div>

 </div>
 <div class="card"><img src="img/parchi-after.png" alt="Parchi: Amit Sharma ko udhaar diya, 500 rupaye, likh liya stamp"></div>
