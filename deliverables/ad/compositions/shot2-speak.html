  <script>
    const tl = gsap.timeline({ paused: true });
    // seeded wave bars
    const N = 19;
    const host = document.getElementById("s2-bars");
    const bars = [];
    for (let i = 0; i < N; i++) {
      const b = document.createElement("div");
      b.style.cssText = "position:absolute;bottom:0;width:26px;height:150px;background:#FFFFFF;border:4px solid #16123A;left:" + (i * 42) + "px;transform-origin:50% 100%";
      host.appendChild(b);
      bars.push(b);
    }
    const rnd = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
    bars.forEach((b, i) => {
      tl.set(b, { scaleY: 0.08 }, 0);
      let t = 0.5 + i * 0.012;
      let k = 0;
      while (t < 4.3) {
        const amp = 0.18 + 0.82 * rnd(i * 31 + k * 7.3);
        const d = 0.14 + 0.12 * rnd(i * 17 + k * 3.1);
        tl.to(b, { scaleY: amp, duration: d, ease: "sine.inOut" }, t);
        t += d; k++;
      }
      tl.to(b, { scaleY: 0.08, duration: 0.25, ease: "power2.out" }, 4.3);
    });
    // rings pulse out of the mic
    [["#s2-ring1", 0.5], ["#s2-ring2", 1.05]].forEach(([r, t0]) => {
      for (let c = 0; c < 3; c++) {
        tl.fromTo(r, { scale: 1, opacity: 0.9 }, { scale: 1.7, opacity: 0, duration: 1.1, ease: "power2.out" }, t0 + c * 1.1);
      }
    });
    tl.fromTo("#s2-mic", { scale: 0.9 }, { scale: 1, duration: 0.25, ease: "power3.out" }, 0.1);
    tl.fromTo("#s2-card", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, 0.3);
    // words land as spoken
    for (let i = 0; i < 6; i++) {
      tl.fromTo("#s2-w" + i, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.14, ease: "power3.out" }, 1.0 + i * 0.34);
    }
    tl.fromTo("#s2-dev", { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.25, ease: "power4.out" }, 3.2);
    window.__timelines["shot2-speak"] = tl;
  </script>
