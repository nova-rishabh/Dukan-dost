  <script>
    const tl = gsap.timeline({ paused: true });
    // real capture as a 20 fps frame sequence (every frame is a plain <img>; the one for time t is shown by timeline)
    const SEQ_N = 112, SEQ_FPS = 20;
    const seqHost = document.getElementById("s5-cam");
    for (let i = 0; i < SEQ_N; i++) {
      const im = document.createElement("img");
      im.src = "assets/captures/seq5/f" + String(i + 1).padStart(3, "0") + ".jpg";
      im.alt = "";
      im.style.cssText = "position:absolute;left:0;top:0;width:720px;height:660px;opacity:" + (i === 0 ? 1 : 0);
      seqHost.appendChild(im);
      if (i > 0) tl.set(im, { opacity: 1 }, i / SEQ_FPS);
    }
    gsap.set("#s5-chat", { y: 520, opacity: 0 });
    // balance counts up
    const o = { v: 1200 };
    const fmt = (n) => "₹" + Math.round(n).toLocaleString("en-IN");
    tl.to(o, { v: 1700, duration: 1.1, ease: "power2.out", onUpdate: () => { document.getElementById("s5-num").textContent = fmt(o.v); } }, 0.25);
    tl.fromTo("#s5-bal", { scale: 1 }, { scale: 1.04, duration: 0.12, ease: "power2.out", transformOrigin: "50% 50%" }, 1.35);
    tl.to("#s5-bal", { scale: 1, duration: 0.2, ease: "power3.out" }, 1.47);
    tl.fromTo("#s5-bal", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.22, ease: "power4.out" }, 0);
    // captions
    tl.fromTo("#s5-a-in", { y: 20 }, { y: 0, duration: 0.18, ease: "power4.out" }, 0);
    tl.fromTo("#s5-b-in", { opacity: 0, y: 40, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power4.out" }, 1.9);
    tl.fromTo("#s5-c-in", { opacity: 0, y: 40, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power4.out" }, 3.2);
    // chat draft rises over the sheet
    tl.to("#s5-chat", { y: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, 2.9);
    // owner presses Send, ticks draw (message tick lands at local 4.95)
    tl.fromTo("#s5-sendtap", { opacity: 1, scale: 0.5 }, { opacity: 0, scale: 1.25, duration: 0.3, ease: "power2.out" }, 4.65);
    tl.to("#s5-send", { x: 2, y: 2, duration: 0.06, ease: "power2.out" }, 4.65);
    tl.to("#s5-send", { x: 0, y: 0, duration: 0.1, ease: "power2.out" }, 4.71);

    tl.fromTo("#s5-t1", { strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.12, ease: "power2.out" }, 4.967);
    tl.fromTo("#s5-t2", { strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.12, ease: "power2.out" }, 5.067);
    tl.to("#s5-send", { opacity: 0, duration: 0.15 }, 5.1);
