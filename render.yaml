# Render Blueprint for Dukaan Dost.
# Two services: the app and the WhatsApp code service. The WhatsApp one is a web service only so its
# /admin page opens in a browser for pairing; the app still reaches it over Render's internal address,
# and every admin action needs ADMIN_PASSWORD.
# Both need a paid instance because each keeps a disk (the shop ledger, and the paired WhatsApp session).
# Render's repo checkout lives at /opt/render/project/src.

services:
  - type: web
    name: dukaan-dost
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    disk:
      name: dukaan-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DUKAAN_MODE
        value: shop
      - key: DUKAAN_DB_FILE
        value: /var/data/dukaan.sqlite
      - key: PROPOSAL_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false # your onrender.com address, e.g. https://dukaan-dost.onrender.com
      - key: DEMO_UPI_VPA
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: WA_APP_KEY
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_SERVICE_URL
        fromService:
          type: web
          name: dukaan-wa
          property: hostport # arrives as host:port; the app adds http://

  - type: web
    name: dukaan-wa
    runtime: node
    plan: starter
    rootDir: services/wa-userauth
    buildCommand: npm ci
    startCommand: npm start
    disk:
      name: dukaan-wa-session
      mountPath: /opt/render/project/src/services/wa-userauth/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3001"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ALLOWED_APPS
        sync: false # written as WA_APP_KEY:WA_APP_SECRET, same pair you give the app (example in services/wa-userauth/.env.example)
